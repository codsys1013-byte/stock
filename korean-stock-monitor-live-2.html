<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="주식모니터" />
  <title>📈 한국주식 모니터</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { background:#020b18; font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif; color:#e2e8f0; }
    ::-webkit-scrollbar { display:none; }
    .spin { animation: spin 1s linear infinite; display:inline-block; }
    @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
  </style>
</head>
<body>
<div id="app"></div>
<script>
const STOCKS = [
  { code:"005930.KS", name:"삼성전자", sector:"반도체", market:"KOSPI" },
  { code:"000660.KS", name:"SK하이닉스", sector:"반도체", market:"KOSPI" },
  { code:"005380.KS", name:"현대차", sector:"자동차", market:"KOSPI" },
  { code:"000270.KS", name:"기아", sector:"자동차", market:"KOSPI" },
  { code:"068270.KS", name:"셀트리온", sector:"바이오", market:"KOSPI" },
  { code:"207940.KS", name:"삼성바이오로직스", sector:"바이오", market:"KOSPI" },
  { code:"051910.KS", name:"LG화학", sector:"화학", market:"KOSPI" },
  { code:"035420.KS", name:"NAVER", sector:"IT", market:"KOSPI" },
  { code:"035720.KS", name:"카카오", sector:"IT", market:"KOSPI" },
  { code:"105560.KS", name:"KB금융", sector:"금융", market:"KOSPI" },
  { code:"055550.KS", name:"신한지주", sector:"금융", market:"KOSPI" },
  { code:"086790.KS", name:"하나금융지주", sector:"금융", market:"KOSPI" },
  { code:"329180.KS", name:"HD현대중공업", sector:"조선", market:"KOSPI" },
  { code:"012450.KS", name:"한화에어로스페이스", sector:"방산", market:"KOSPI" },
  { code:"034020.KS", name:"두산에너빌리티", sector:"에너지", market:"KOSPI" },
  { code:"373220.KS", name:"LG에너지솔루션", sector:"2차전지", market:"KOSPI" },
  { code:"247540.KS", name:"에코프로비엠", sector:"2차전지", market:"KOSDAQ" },
  { code:"086520.KS", name:"에코프로", sector:"2차전지", market:"KOSDAQ" },
  { code:"091990.KS", name:"셀트리온헬스케어", sector:"바이오", market:"KOSDAQ" },
  { code:"196170.KS", name:"알테오젠", sector:"바이오", market:"KOSDAQ" },
];

const SECTORS = ["전체","반도체","자동차","바이오","IT","금융","방산","조선","2차전지","에너지","화학"];

// 상태
let state = {
  stocks: STOCKS.map(s => ({...s, price:0, change:0, changeAmt:0, prevClose:0, history:[], consecutiveDrop:false, inPortfolio:false, quantity:0, avgPrice:0, loading:true, error:false})),
  tab: "market",
  sector: "전체",
  market: "전체",
  search: "",
  selected: null,
  pmModal: null,
  qty: "",
  avg: "",
  lastUpdate: null,
  alertLog: [],
  loadingAll: true,
  portfolio: [],
};

const fmt = n => n?.toLocaleString("ko-KR");
const pct = n => (n>=0?`+${n.toFixed(2)}%`:`${n.toFixed(2)}%`);
const clr = n => n>0?"#ef4444":n<0?"#3b82f6":"#94a3b8";

// Yahoo Finance 실제 주가 가져오기
async function fetchStockPrice(ticker) {
  try {
    const url = `https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=1d&range=10d`;
    // 여러 프록시 순서대로 시도
    const proxies = [
      `https://corsproxy.io/?${encodeURIComponent(url)}`,
      `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
      `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
    ];
    let parsed = null;
    for (const proxyUrl of proxies) {
      try {
        const res = await fetch(proxyUrl, { signal: AbortSignal.timeout(8000) });
        const text = await res.text();
        let json;
        try { json = JSON.parse(text); } catch(e) { continue; }
        if (json.contents) { try { parsed = JSON.parse(json.contents); } catch(e){} }
        else if (json.chart) { parsed = json; }
        if (parsed) break;
      } catch(e) { continue; }
    }
    const result = parsed?.chart?.result?.[0];
    if (!result) return null;

    const closes = result.indicators?.quote?.[0]?.close || [];
    const timestamps = result.timestamp || [];
    const meta = result.meta;

    const validCloses = closes.filter(c => c !== null);
    const currentPrice = meta.regularMarketPrice || validCloses[validCloses.length-1];
    const prevClose = meta.chartPreviousClose || validCloses[validCloses.length-2] || currentPrice;
    const changeAmt = currentPrice - prevClose;
    const changePct = (changeAmt / prevClose) * 100;

    // 10일 히스토리
    const history = closes.slice(-10).map((c, i) => {
      const d = new Date((timestamps[timestamps.length-10+i] || Date.now()/1000) * 1000);
      return {
        date: d.toLocaleDateString("ko-KR", {month:"2-digit", day:"2-digit"}),
        price: c || currentPrice,
        change: i === 0 ? 0 : ((c - closes[closes.length-10+i-1]) / closes[closes.length-10+i-1]) * 100
      };
    });

    // 3일 연속 하락 체크
    const last3 = history.slice(-3);
    const consecutiveDrop = last3.length === 3 && last3.every((h,i) => i===0 || h.price < last3[i-1].price);

    return { price: Math.round(currentPrice), changeAmt: Math.round(changeAmt), change: parseFloat(changePct.toFixed(2)), prevClose: Math.round(prevClose), history, consecutiveDrop };
  } catch(e) {
    return null;
  }
}

async function loadAllPrices() {
  state.loadingAll = true;
  render();

  const results = await Promise.allSettled(
    state.stocks.map(s => fetchStockPrice(s.code))
  );

  state.stocks = state.stocks.map((s, i) => {
    const r = results[i];
    if (r.status === "fulfilled" && r.value) {
      return {...s, ...r.value, loading:false, error:false};
    }
    return {...s, loading:false, error:true};
  });

  // 알림 로그
  const dropped = state.stocks.filter(s => s.consecutiveDrop);
  if (dropped.length > 0) {
    const now = new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"});
    state.alertLog = [...dropped.map(s=>({id:`${s.code}-${Date.now()}`,name:s.name,change:s.change,time:now})), ...state.alertLog].slice(0,50);
  }

  state.loadingAll = false;
  state.lastUpdate = new Date();
  render();
}

// 미니 SVG 차트
function miniChart(history, color) {
  if (!history || history.length < 2) return `<svg width="80" height="32"></svg>`;
  const prices = history.map(h=>h.price).filter(p=>p>0);
  if (prices.length < 2) return `<svg width="80" height="32"></svg>`;
  const min=Math.min(...prices), max=Math.max(...prices), range=max-min||1;
  const pts = prices.map((p,i)=>`${(i/(prices.length-1))*80},${32-((p-min)/range)*30}`).join(" ");
  return `<svg width="80" height="32" style="display:block"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
}

// 풀 차트
function fullChart(stock) {
  const history = stock.history;
  const prices = history.map(h=>h.price).filter(p=>p>0);
  if (prices.length < 2) return '<div style="text-align:center;color:#475569;padding:20px">차트 데이터 없음</div>';
  const min=Math.min(...prices), max=Math.max(...prices), range=max-min||1;
  const W=480,H=160,P=40;
  const pts = prices.map((p,i)=>`${P+(i/(prices.length-1))*(W-P*2)},${P+((max-p)/range)*(H-P*2)}`);
  const area = `M${pts[0]} ${pts.slice(1).map(p=>`L${p}`).join(" ")} L${pts[pts.length-1].split(",")[0]},${H-P} L${P},${H-P} Z`;
  const color = stock.change>=0?"#ef4444":"#3b82f6";
  const gridLines = [0,.25,.5,.75,1].map(t=>{
    const y=P+t*(H-P*2);
    return `<line x1="${P}" y1="${y}" x2="${W-P}" y2="${y}" stroke="#1e293b" stroke-width="1"/>
    <text x="${P-6}" y="${y+4}" text-anchor="end" font-size="9" fill="#475569">${fmt(Math.round(max-t*range))}</text>`;
  }).join("");
  const dateLabels = history.filter((_,i)=>i%2===0).map((h,i)=>{
    const x=P+(i*2/(prices.length-1))*(W-P*2);
    return `<text x="${x}" y="${H-P+14}" text-anchor="middle" font-size="9" fill="#475569">${h.date}</text>`;
  }).join("");
  return `<svg width="100%" viewBox="0 0 ${W} ${H}" style="overflow:visible">
    <defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0.02"/>
    </linearGradient></defs>
    ${gridLines}
    <path d="${area}" fill="url(#cg)"/>
    <polyline points="${pts.join(" ")}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>
    ${dateLabels}
  </svg>`;
}

// 렌더링
function render() {
  const filtered = state.stocks.filter(s =>
    (state.sector==="전체"||s.sector===state.sector) &&
    (state.market==="전체"||s.market===state.market) &&
    (s.name.includes(state.search)||s.code.includes(state.search))
  );
  const portfolio = state.stocks.filter(s=>s.inPortfolio);
  const alerts = state.stocks.filter(s=>s.consecutiveDrop);
  const totalInv = portfolio.reduce((a,s)=>a+s.avgPrice*s.quantity,0);
  const totalCur = portfolio.reduce((a,s)=>a+s.price*s.quantity,0);
  const pnl = totalCur-totalInv;

  const C = {
    card: `background:#0d1f33;border:1px solid #1e3a5f;border-radius:10px;padding:13px 14px;margin-bottom:9px;cursor:pointer`,
    alertCard: `background:#1a0f0f;border:1px solid #7f1d1d;border-radius:10px;padding:13px 14px;margin-bottom:9px;cursor:pointer`,
    chip: a => `padding:5px 10px;border-radius:20px;font-size:12px;cursor:pointer;background:${a?"#38bdf8":"#0a1628"};color:${a?"#020b18":"#64748b"};border:1px solid ${a?"#38bdf8":"#1e3a5f"};font-weight:${a?"700":"400"};white-space:nowrap;flex-shrink:0`,
    btn: c => `background:${c};border:none;border-radius:6px;padding:7px 13px;color:#fff;font-size:12px;font-weight:600;cursor:pointer`,
    bdg: c => `background:${c};border-radius:4px;padding:2px 6px;font-size:10px;font-weight:600`,
  };

  const stockCard = s => `
    <div style="${C.card};border:1px solid ${s.consecutiveDrop?"#7f1d1d":"#1e3a5f"}" onclick="selectStock('${s.code}')">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:5px;margin-bottom:2px;flex-wrap:wrap">
            <span style="font-weight:700;font-size:14px">${s.name}</span>
            <span style="${C.bdg("#0a1628")};color:#475569;border:1px solid #1e3a5f">${s.market}</span>
            <span style="${C.bdg("#0a1628")};color:#38bdf8;border:1px solid #1e3a5f">${s.sector}</span>
            ${s.consecutiveDrop?`<span style="${C.bdg("#7f1d1d")};color:#fca5a5">🔴 3일↓</span>`:""}
          </div>
          <div style="font-size:10px;color:#475569;margin-bottom:4px">${s.code}</div>
          ${s.loading
            ? `<span style="color:#475569;font-size:13px">⏳ 로딩중...</span>`
            : s.error
            ? `<span style="color:#f59e0b;font-size:13px">⚠️ 데이터 없음</span>`
            : `<span style="font-size:15px;font-weight:700">₩${fmt(s.price)}</span>
               <span style="font-size:12px;color:${clr(s.change)};margin-left:7px;font-weight:600">${pct(s.change)}</span>
               <span style="font-size:11px;color:${clr(s.changeAmt)};margin-left:4px">(${s.changeAmt>=0?"+":""}${fmt(s.changeAmt)})</span>`
          }
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:7px;margin-left:8px">
          ${s.loading ? `<div style="width:80px;height:32px;background:#0a1628;border-radius:4px"></div>` : miniChart(s.history, clr(s.change))}
          <button style="${C.btn(s.inPortfolio?"#1e3a5f":"#0c4a6e")}" onclick="event.stopPropagation();openPm('${s.code}')">
            ${s.inPortfolio?"✓ 보유":"+ 담기"}
          </button>
        </div>
      </div>
    </div>`;

  let content = "";

  if (state.tab === "market") {
    content = `
      <input style="background:#0a1628;border:1px solid #1e3a5f;border-radius:6px;padding:9px 12px;color:#e2e8f0;font-size:13px;width:100%;box-sizing:border-box;margin-bottom:10px"
        placeholder="🔍 종목명 또는 코드" value="${state.search}" oninput="state.search=this.value;render()"/>
      <div style="display:flex;gap:5px;margin-bottom:9px">
        ${["전체","KOSPI","KOSDAQ"].map(m=>`<div style="${C.chip(state.market===m)}" onclick="state.market='${m}';render()">${m}</div>`).join("")}
      </div>
      <div style="display:flex;gap:5px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px">
        ${SECTORS.map(s=>`<div style="${C.chip(state.sector===s)}" onclick="state.sector='${s}';render()">${s}</div>`).join("")}
      </div>
      <div style="font-size:11px;color:#475569;margin-bottom:7px">${filtered.length}개 종목 · ${state.loadingAll?"로딩중...":state.lastUpdate?"15분 지연 · "+state.lastUpdate.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})+" 기준":""}</div>
      ${filtered.map(stockCard).join("")}`;
  }

  else if (state.tab === "portfolio") {
    if (portfolio.length === 0) {
      content = `<div style="text-align:center;padding:48px 0;color:#475569">
        <div style="font-size:36px;margin-bottom:10px">💼</div>
        <div style="font-size:14px;color:#94a3b8;margin-bottom:4px">포트폴리오가 비어 있어요</div>
        <div style="font-size:12px">시장 탭에서 종목을 담아보세요</div>
      </div>`;
    } else {
      content = `
        <div style="background:#0d1f33;border:1px solid #1e3a5f;border-radius:12px;padding:15px;margin-bottom:14px">
          <div style="font-size:11px;color:#475569;margin-bottom:10px">전체 포트폴리오</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
            ${[["평가금액",`₩${fmt(Math.round(totalCur))}`,"#e2e8f0"],["투자금액",`₩${fmt(Math.round(totalInv))}`,"#e2e8f0"],
               ["손익",`${pnl>=0?"+":""}₩${fmt(Math.round(pnl))}`,clr(pnl)],["수익률",pct(totalInv>0?pnl/totalInv*100:0),clr(pnl)]]
              .map(([l,v,c])=>`<div><div style="font-size:11px;color:#475569">${l}</div><div style="font-size:14px;font-weight:700;color:${c}">${v}</div></div>`).join("")}
          </div>
        </div>
        ${portfolio.map(s=>{
          const p=(s.price-s.avgPrice)*s.quantity, pp=((s.price-s.avgPrice)/s.avgPrice)*100;
          return `<div style="${C.card};border:1px solid ${s.consecutiveDrop?"#7f1d1d":"#1e3a5f"}">
            <div style="display:flex;justify-content:space-between">
              <div>
                <div style="display:flex;gap:5px;align-items:center;margin-bottom:3px">
                  <span style="font-weight:700">${s.name}</span>
                  ${s.consecutiveDrop?`<span style="${C.bdg("#7f1d1d")};color:#fca5a5">🔴 3일↓</span>`:""}
                </div>
                <div style="font-size:11px;color:#475569;margin-bottom:6px">${s.quantity}주 · 평균 ₩${fmt(s.avgPrice)}</div>
                <div style="font-size:14px;font-weight:700">₩${fmt(s.price)}</div>
                <div style="font-size:12px;color:${clr(p)};font-weight:600">${p>=0?"+":""}₩${fmt(Math.round(p))} (${pct(pp)})</div>
              </div>
              <div style="display:flex;flex-direction:column;align-items:flex-end;gap:7px">
                ${miniChart(s.history,clr(s.change))}
                <button style="${C.btn("#7f1d1d")}" onclick="removePortfolio('${s.code}')">제거</button>
              </div>
            </div>
          </div>`;
        }).join("")}`;
    }
  }

  else if (state.tab === "alerts") {
    content = `
      <div style="background:#1a0f0f;border:1px solid #7f1d1d;border-radius:10px;padding:11px 14px;margin-bottom:12px;font-size:12px;color:#fca5a5">
        🚨 3일 연속 하락 중인 종목입니다. 매수 시 추가 하락 위험이 있습니다.
      </div>
      ${alerts.length===0
        ? `<div style="text-align:center;padding:48px 0;color:#475569">
            <div style="font-size:36px;margin-bottom:10px">✅</div>
            <div style="font-size:14px;color:#94a3b8">현재 3일 연속 하락 종목 없음</div>
          </div>`
        : alerts.map(s=>`
          <div style="${C.alertCard}" onclick="selectStock('${s.code}')">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div>
                <div style="display:flex;gap:5px;align-items:center;margin-bottom:3px">
                  <span style="font-weight:700;color:#fca5a5">${s.name}</span>
                  <span style="${C.bdg("#0a1628")};color:#475569;border:1px solid #1e3a5f">${s.market}</span>
                </div>
                <div style="font-size:10px;color:#64748b;margin-bottom:5px">${s.sector} · ${s.code}</div>
                <div style="font-size:14px;font-weight:700">₩${fmt(s.price)}</div>
                <div style="font-size:12px;color:#3b82f6;font-weight:600">${pct(s.change)} 오늘</div>
              </div>
              ${miniChart(s.history,"#ef4444")}
            </div>
          </div>`).join("")}
      ${state.alertLog.length>0?`
        <div style="font-size:11px;color:#475569;margin:14px 0 7px">📋 알림 기록</div>
        ${state.alertLog.slice(0,10).map(a=>`
          <div style="background:#0d1f33;border:1px solid #1e3a5f;border-radius:8px;padding:9px 13px;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center">
            <div><span style="font-weight:600;font-size:13px">${a.name}</span><span style="font-size:11px;color:#3b82f6;margin-left:7px">${pct(a.change)}</span></div>
            <span style="font-size:10px;color:#475569">${a.time}</span>
          </div>`).join("")}`:""}`;
  }

  // 종목 상세 모달
  const sel = state.selected ? state.stocks.find(s=>s.code===state.selected) : null;
  const selModal = sel ? `
    <div style="position:fixed;inset:0;background:rgba(0,0,0,0.88);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px" onclick="state.selected=null;render()">
      <div style="background:#0d1f33;border:1px solid #1e3a5f;border-radius:14px;padding:22px;width:100%;max-width:500px;max-height:88vh;overflow-y:auto" onclick="event.stopPropagation()">
        <div style="display:flex;justify-content:space-between;margin-bottom:14px">
          <div>
            <div style="display:flex;gap:5px;align-items:center;margin-bottom:3px">
              <span style="font-size:17px;font-weight:800">${sel.name}</span>
              ${sel.consecutiveDrop?`<span style="${C.bdg("#7f1d1d")};color:#fca5a5">🔴 3일↓</span>`:""}
            </div>
            <div style="font-size:11px;color:#475569">${sel.code} · ${sel.market} · ${sel.sector}</div>
          </div>
          <button onclick="state.selected=null;render()" style="background:none;border:none;color:#64748b;font-size:20px;cursor:pointer">✕</button>
        </div>
        <div style="margin-bottom:5px">
          <span style="font-size:22px;font-weight:800">₩${fmt(sel.price)}</span>
          <span style="font-size:15px;color:${clr(sel.change)};margin-left:9px;font-weight:700">${pct(sel.change)}</span>
          <span style="font-size:12px;color:${clr(sel.changeAmt)};margin-left:5px">(${sel.changeAmt>=0?"+":""}${fmt(sel.changeAmt)}원)</span>
        </div>
        <div style="font-size:11px;color:#475569;margin-bottom:14px">전일종가: ₩${fmt(sel.prevClose)}</div>
        <div style="margin:14px 0">${fullChart(sel)}</div>
        <div style="font-size:11px;color:#475569;margin-bottom:7px">최근 10일 변동</div>
        <div style="display:flex;gap:3px;overflow-x:auto;padding-bottom:5px;margin-bottom:14px">
          ${sel.history.slice(-10).map((h,i)=>`
            <div style="text-align:center;min-width:42px;background:#0a1628;border-radius:6px;padding:5px 3px">
              <div style="font-size:9px;color:#475569;margin-bottom:2px">${h.date}</div>
              <div style="font-size:9px;color:${h.change>=0?"#ef4444":"#3b82f6"};font-weight:600">
                ${i===0?"-":(h.change>=0?`+${h.change.toFixed(1)}`:`${h.change.toFixed(1)}`)}%
              </div>
            </div>`).join("")}
        </div>
        <button onclick="openPm('${sel.code}');state.selected=null;render()" style="${C.btn("#0c4a6e")};width:100%;padding:11px;font-size:13px">
          💼 포트폴리오에 추가
        </button>
      </div>
    </div>` : "";

  // 포트폴리오 추가 모달
  const pm = state.pmModal ? state.stocks.find(s=>s.code===state.pmModal) : null;
  const pmModalHtml = pm ? `
    <div style="position:fixed;inset:0;background:rgba(0,0,0,0.88);display:flex;align-items:center;justify-content:center;z-index:101;padding:16px" onclick="state.pmModal=null;render()">
      <div style="background:#0d1f33;border:1px solid #1e3a5f;border-radius:14px;padding:22px;width:100%;max-width:340px" onclick="event.stopPropagation()">
        <div style="font-size:15px;font-weight:700;margin-bottom:3px">${pm.name} 담기</div>
        <div style="font-size:11px;color:#475569;margin-bottom:18px">현재가: ₩${fmt(pm.price)}</div>
        <div style="margin-bottom:11px">
          <div style="font-size:11px;color:#94a3b8;margin-bottom:5px">보유 수량 (주)</div>
          <input id="qty-input" style="background:#0a1628;border:1px solid #1e3a5f;border-radius:6px;padding:9px 12px;color:#e2e8f0;font-size:13px;width:100%;box-sizing:border-box"
            type="number" placeholder="예: 10" value="${state.qty}" oninput="state.qty=this.value"/>
        </div>
        <div style="margin-bottom:18px">
          <div style="font-size:11px;color:#94a3b8;margin-bottom:5px">평균 매수가 (원)</div>
          <input id="avg-input" style="background:#0a1628;border:1px solid #1e3a5f;border-radius:6px;padding:9px 12px;color:#e2e8f0;font-size:13px;width:100%;box-sizing:border-box"
            type="number" placeholder="예: ${fmt(pm.price)}" value="${state.avg}" oninput="state.avg=this.value"/>
        </div>
        ${state.qty&&state.avg?`
          <div style="background:#0a1628;border-radius:8px;padding:11px;margin-bottom:14px;font-size:12px">
            <div style="display:flex;justify-content:space-between;margin-bottom:3px">
              <span style="color:#475569">투자금액</span><span>₩${fmt(parseInt(state.avg)*parseInt(state.qty))}</span>
            </div>
            <div style="display:flex;justify-content:space-between">
              <span style="color:#475569">현재평가</span><span>₩${fmt(pm.price*parseInt(state.qty))}</span>
            </div>
          </div>`:""}
        <div style="display:flex;gap:7px">
          <button onclick="state.pmModal=null;render()" style="${C.btn("#1e3a5f")};flex:1;padding:10px">취소</button>
          <button onclick="addPortfolio('${pm.code}')" style="${C.btn("#0369a1")};flex:1;padding:10px">추가</button>
        </div>
      </div>
    </div>` : "";

  document.getElementById("app").innerHTML = `
    <div style="background:#020b18;min-height:100vh;color:#e2e8f0">
      <!-- 헤더 -->
      <div style="background:linear-gradient(135deg,#0f1e2e,#0a1628);border-bottom:1px solid #1e3a5f;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50">
        <div>
          <div style="font-size:17px;font-weight:700;color:#38bdf8">📈 한국주식 모니터</div>
          <div style="font-size:10px;color:#475569;margin-top:2px">시총 1조+ · Yahoo Finance · 15분 지연</div>
        </div>
        <div style="display:flex;gap:6px;align-items:center">
          ${alerts.length>0?`<span style="background:#7f1d1d;border-radius:4px;padding:2px 7px;font-size:11px;font-weight:600;color:#fca5a5">🔔 ${alerts.length}종목↓</span>`:""}
          <button onclick="loadAllPrices()" style="${C.btn("#1e3a5f")}">${state.loadingAll?'<span class="spin">⟳</span>':'🔄'}</button>
        </div>
      </div>

      <!-- 탭 -->
      <div style="display:flex;background:#0a1628;border-bottom:1px solid #1e3a5f;position:sticky;top:56px;z-index:49">
        ${[["market","🏠 시장"],["portfolio",`💼 포트(${portfolio.length})`],["alerts",`🚨 경보(${alerts.length})`]]
          .map(([k,l])=>`<div style="flex:1;padding:11px 4px;text-align:center;font-size:12px;font-weight:${state.tab===k?"700":"400"};color:${state.tab===k?"#38bdf8":"#64748b"};border-bottom:${state.tab===k?"2px solid #38bdf8":"2px solid transparent"};cursor:pointer" onclick="state.tab='${k}';render()">${l}</div>`).join("")}
      </div>

      <div style="padding:14px;max-width:600px;margin:0 auto">
        ${content}
      </div>
    </div>
    ${selModal}
    ${pmModalHtml}`;
}

function selectStock(code) { state.selected = code; render(); }
function openPm(code) { state.pmModal = code; state.qty = ""; state.avg = ""; render(); }
function removePortfolio(code) {
  state.stocks = state.stocks.map(s => s.code===code ? {...s,inPortfolio:false,quantity:0,avgPrice:0} : s);
  render();
}
function addPortfolio(code) {
  const q=parseInt(state.qty), ap=parseInt(state.avg);
  if(!q||!ap) return;
  state.stocks = state.stocks.map(s => s.code===code ? {...s,inPortfolio:true,quantity:q,avgPrice:ap} : s);
  state.pmModal = null; state.qty = ""; state.avg = "";
  render();
}

// 시작
render();
loadAllPrices();
// 15분마다 자동 갱신
setInterval(loadAllPrices, 15 * 60 * 1000);
</script>
</body>
</html>
